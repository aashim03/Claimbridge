[project]
name = "claimbridge"
version = "0.1.0"
description = "AI caseworker for denied health-insurance claims, with graph memory on FalkorDB"
requires-python = ">=3.11"
dependencies = [
    "falkordb>=1.0.10",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "fastembed>=0.4",
    "python-dotenv>=1.0",
    "openai>=3.31.0",
    "anthropic>=1.15.0",
    "fastapi>=0.143.3",
    "uvicorn[standard]>=0.54.0",
    "mcp>=2.3.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claimbridge"]
