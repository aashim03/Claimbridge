# PRE-REGISTERED generalization check. Unseen cases, written BEFORE they were ever run.
#
# Authorship, stated plainly: these cases and their expected answers were written by the AI coding assistant that
# also helped build the system. The expected answers for GEN-01..GEN-13 were derived by hand from the policy and
# finding definitions in data/knowledge and were never produced by running the system. That makes this a
# *separately authored* set, NOT an independent review by someone who did not build the product.
#
# Each case has a `kind`, and the report keeps them apart because they prove different things:
#   generalization            unseen letters whose expectations were set before any run (GEN-01..GEN-13)
#   known-defect-regression   GEN-14..GEN-17 were written AFTER defects in how Intake treats a cited section were found,
#                             and the Intake checks were added in response. They are regression tests, not evidence of
#                             generalization.
#   design-intent             GEN-18, GEN-19 test behaviour the design already aimed for (unknown reasons, untrusted
#                             instructions); the author knew the intended answer when writing them.
#
# A teammate should add or replace cases using data/scenarios/generalization.template.yaml; their cases belong in a
# separate file and run the same way.
#
# Expectations are locked by data/scenarios/generalization.sha256 on the first run. If the file changes afterwards
# the runner refuses to continue, so expected answers cannot be quietly edited to fit results.
#
# Fields
#   notice            hand-written denial letter ({id} becomes the claim id)
#   expected.outcome  complete = the agents produce a recommendation; escalate = a person must look (NEEDS_HUMAN)
#   expected.*        reason, version, disposition, missing_evidence, applicable_findings (null = not scored)
#   expected.because  the authoring reasoning, from the policy text, so a reviewer can disagree with it
# Defaults: tenant TEN-02, in_network true, is_emergency false, filing_lag_days 20, enrolled_months 12.

registered_on: "2026-10-17"
cases:

  # ---- boundary service dates ------------------------------------------------------------------------------
  - id: GEN-01
    purpose: last day of the 2025 policy
    service: MRI
    service_date: 20251231
    evidence: [SPECIALIST_REFERRAL]
    notice: >
      Lumen Health Assurance - Notice of claim denial. Claim {id}. Outpatient MRI performed 2025-12-31. We could not
      find a prior authorization for this scan on the plan's records. See Section 4.2 of your LumenCare Silver policy.
      You may appeal this decision within 180 days of this notice.
    expected:
      outcome: complete
      reason: PREAUTH_MISSING
      version: V2025
      disposition: APPEAL_VIABLE
      missing_evidence: []
      applicable_findings: [F-MRI-REFERRAL]
      because: "31 Dec 2025 is still the 2025 policy. Its 4.2 keeps the specialist-referral exception, the referral is on file, so the referral precedent applies and nothing is missing."

  - id: GEN-02
    purpose: first day of the 2026 policy
    service: MRI
    service_date: 20260101
    evidence: [SPECIALIST_REFERRAL]
