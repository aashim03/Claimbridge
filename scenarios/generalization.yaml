      reason: TIMELY_FILING
      version: V2026
      disposition: NO_BASIS_ESCALATE
      missing_evidence: null
      applicable_findings: null
      because: "Day 91 exceeds the 90-day limit in force on the service date: the governing terms leave no appeal basis."

