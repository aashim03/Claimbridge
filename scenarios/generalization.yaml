      version: V2026
      disposition: APPEAL_VIABLE
      missing_evidence: []
      applicable_findings: [F-MATERNITY-9M]
      because: "2026 section 3.2 requires 9 months; 9 is not fewer than 9, so the waiting period is met. The enrollment record is on file and the 2026 precedent applies."

  - id: GEN-06
    purpose: one month short of the 2026 waiting period
    service: MATERNITY
    service_date: 20260315
