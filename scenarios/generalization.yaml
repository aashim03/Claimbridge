      disposition: NO_BASIS_ESCALATE
      missing_evidence: null
      applicable_findings: null
      because: "8 months is fewer than the 9 required by the 2026 policy: no basis for appeal. Whether the precedent 'applies' is ambiguous here, so it is not scored."

  # ---- negation and paraphrase: no section number to lean on --------------------------------------------------
  - id: GEN-07
    purpose: negation (it is NOT a prior-authorization denial)
    service: MRI
    service_date: 20260412
    evidence: [ITEMIZED_BILL]
    notice: >
      Lumen Health Assurance - Notice of claim denial. Claim {id}. Outpatient MRI on 2026-04-12. This claim was not
