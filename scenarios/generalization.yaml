    service: MRI
    service_date: 20250909
    evidence: []
    notice: >
      Lumen Health Assurance - Notice of claim denial. Claim {id}. Outpatient MRI on 2025-09-09. Our plan requires that
      this kind of scan be approved in advance, and there is no record that approval was requested before the scan took
