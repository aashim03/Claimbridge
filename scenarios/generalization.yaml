      Lumen Health Assurance - Notice of claim denial. Claim {id}. Outpatient MRI performed 2026-01-01. We could not
      find a prior authorization for this scan on the plan's records. See Section 4.2 of your LumenCare Silver policy.
      You may appeal this decision within 180 days of this notice.
    expected:
      outcome: complete
      reason: PREAUTH_MISSING
      version: V2026
      disposition: APPEAL_NEEDS_EVIDENCE
      missing_evidence: [PHYSICIAN_NECESSITY_LETTER, RETRO_AUTH_REQUEST]
      applicable_findings: []
      because: "1 Jan 2026 is the 2026 policy, which removed the referral exception: the referral precedent no longer applies, and the clause now needs a retroactive request plus a necessity letter."

