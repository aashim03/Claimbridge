    evidence: [ITEMIZED_BILL]
    notice: >
      Lumen Health Assurance - Notice of claim denial. Claim {id}. Physiotherapy on 2026-02-14. There is no coding
      problem with this claim and the service is a covered benefit. We are denying it because our records show an
      earlier claim for the same member, provider, date of service and amount, so this one is treated as a duplicate.
      You may appeal this decision within 180 days of this notice.
    expected:
      outcome: complete
      reason: DUPLICATE_CLAIM
      version: V2026
      disposition: APPEAL_VIABLE
      missing_evidence: []
      applicable_findings: [F-DUPLICATE]
      because: "Duplicate submission; the itemized bill (on file) is what section 9.5 asks for to show distinct services. The duplicate precedent is valid in 2026."

  - id: GEN-09
