    filing_lag_days: 90
    evidence: [PROOF_OF_TIMELY_FILING]
    notice: >
      Lumen Health Assurance - Notice of claim denial. Claim {id}. Outpatient MRI performed 2026-02-10. The claim reached
      us after the filing deadline. See Section 9.1 of your LumenCare Silver policy. You may appeal this decision within
      180 days of this notice.
    expected:
      outcome: complete
      reason: TIMELY_FILING
      version: V2026
      disposition: APPEAL_VIABLE
      missing_evidence: []
      applicable_findings: []
      because: "The 2026 limit is 90 days and the claim was filed on day 90, which is not late. Proof of timely filing is on file. The 180-day precedent was learned under the old clause and does not carry over."

  - id: GEN-04
    purpose: filed one day past the 2026 timely-filing limit
    service: MRI
    service_date: 20260210
    filing_lag_days: 91
    evidence: [PROOF_OF_TIMELY_FILING]
    notice: >
      Lumen Health Assurance - Notice of claim denial. Claim {id}. Outpatient MRI performed 2026-02-10. The claim reached
