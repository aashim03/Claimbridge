      disposition: APPEAL_NEEDS_EVIDENCE
      missing_evidence: [SPECIALIST_REFERRAL]
      applicable_findings: [F-MRI-REFERRAL]
      because: "Advance approval not obtained is prior authorization. Under the 2025 policy the referral exception holds and its precedent applies, so the specialist referral is what is missing."

