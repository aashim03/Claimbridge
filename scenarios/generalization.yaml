      procedure code on the bill does not match the scan that was actually performed. Please resubmit with a corrected
      code. You may appeal this decision within 180 days of this notice.
    expected:
      outcome: complete
      reason: CODING_ERROR
      version: V2026
      disposition: APPEAL_NEEDS_EVIDENCE
      missing_evidence: [CORRECTED_CODING_SUBMISSION]
      applicable_findings: [F-CODING]
      because: "The stated reason is a coding mismatch, with the authorization explicitly excluded. Section 9.4 needs an itemized bill (on file) and a corrected coding submission (missing). The coding precedent is valid in every version."

