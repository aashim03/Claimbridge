  # ---- the notice contradicts itself, or is not about us: the right answer is a person ------------------------------
  - id: GEN-14
    kind: known-defect-regression
    purpose: the section number says prior authorization, the wording says coding
    service: MRI
    service_date: 20260302
    evidence: [ITEMIZED_BILL]
    notice: >
      Lumen Health Assurance - Notice of claim denial. Claim {id}. Outpatient MRI on 2026-03-02. The billing code
      submitted does not match the procedure performed. See Section 4.2 (Prior authorization for outpatient MRI) of
      your LumenCare Silver policy. You may appeal this decision within 180 days of this notice.
    expected:
      outcome: escalate
      escalation_phrase: "implies PREAUTH_MISSING"
      because: "A section number and the wording of the same letter disagree about why the claim was denied. A person should decide; the system must not silently pick one."

