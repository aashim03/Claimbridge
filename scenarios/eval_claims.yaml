# Evaluation claims, including the trap cases from docs/03-dataset-and-traps.md.
#
# `reason` is the TRUE denial reason. It is used only to write the denial-notice
# text and to compute ground truth. It is never loaded into the graph: the
# Intake agent must recover it from the notice text.
#
# notice_style: cited (quotes the section) | paraphrase (clause title, no section)
#               | vague (generic wording) | misleading (wording hints at another reason)
# Defaults: in_network true, is_emergency false, filing_lag_days 20, tenant round-robin.

# ---- T1: version drift -------------------------------------------------------
- {claim_id: EV-T1-01, trap: T1, service: MRI, reason: PREAUTH_MISSING, service_date: 20260310,
   evidence: [SPECIALIST_REFERRAL, ITEMIZED_BILL], notice_style: cited,
   note: "Referral exception removed in 2026; the 2025 referral precedent must be rejected"}
- {claim_id: EV-T1-02, trap: T1, service: PHYSIO, reason: NOT_MED_NECESSARY, service_date: 20260415,
   session_number: 15, evidence: [PROGRESS_NOTES], notice_style: paraphrase,
   note: "2026 cut sessions to 12; progress notes alone no longer suffice"}
- {claim_id: EV-T1-03, trap: T1, service: ER_VISIT, reason: OUT_OF_NETWORK, service_date: 20260205,
   in_network: false, is_emergency: true, evidence: [EMERGENCY_ATTESTATION, DISCHARGE_SUMMARY],
   notice_style: cited, note: "72h-window precedent does not carry into the 48h 2026 clause"}
- {claim_id: EV-T1-04, trap: T1, service: BARIATRIC, reason: EXCLUDED_SERVICE, service_date: 20240612,
   evidence: [BMI_RECORD, SUPERVISED_PROGRAM_RECORD], notice_style: cited,
   note: "Reverse drift: the 2025 coverage precedent does not apply to a 2024 service date"}

