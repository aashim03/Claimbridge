# ---- M: memory gain (no precedent exists for ambulance necessity at the start) ----
# A is approved and its real outcome (OVERTURNED) recorded -> the Curator learns a Finding.
# B1 is processed before that, B2 after: same facts, B2 should cite the learned precedent.
# Ground truth below is the "before memory" state.
- {claim_id: EV-M-A, trap: M, service: AMBULANCE, reason: NOT_MED_NECESSARY, service_date: 20250610,
   is_emergency: true, evidence: [EMERGENCY_ATTESTATION, ITEMIZED_BILL], notice_style: cited}
