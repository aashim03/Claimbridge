# Fictional taxonomy for ClaimBridge. All synthetic.

insurer:
  insurer_id: INS-LUMEN
  name: Lumen Health Assurance (fictional)

plan:
  plan_id: PLAN-SILVER
  name: LumenCare Silver
  tier: silver

versions:
  - {version_id: V2024, label: "2024", effective_from: 20240101, effective_to: 20250101}
  - {version_id: V2025, label: "2025", effective_from: 20250101, effective_to: 20260101}
  - {version_id: V2026, label: "2026", effective_from: 20260101, effective_to: 99991231}

# `profile` is the text embedded for the Intake vector cross-check (Q2).
denial_reasons:
  - code: PREAUTH_MISSING
    name: Prior authorization not obtained
    profile: >
      Prior authorization was not obtained. The service required pre-approval,
      precertification or authorization from the plan before it was performed.
      No authorization on file. Approval was not requested in advance.
  - code: NOT_MED_NECESSARY
    name: Not medically necessary
    profile: >
      The service was not medically necessary. Clinical documentation does not
      support medical necessity. The treatment exceeds what is clinically
      appropriate or the number of covered sessions without justification.
  - code: EXCLUDED_SERVICE
    name: Service excluded by the policy
    profile: >
      The service is excluded from coverage under this policy. This benefit is
      not covered. The procedure is listed as an exclusion, investigational,
      experimental, or a non-covered service.
  - code: WAITING_PERIOD
    name: Waiting period not satisfied
    profile: >
      The waiting period has not been satisfied. Coverage for this benefit
      begins only after the member has been enrolled for the required number
      of months. Enrollment duration is insufficient.
  - code: OUT_OF_NETWORK
    name: Provider out of network
    profile: >
      The provider or facility is out of network. Services from non-participating,
      non-contracted providers are not covered except in specific circumstances.
  - code: INCOMPLETE_DOCS
    name: Incomplete documentation
    profile: >
      The claim was submitted with incomplete documentation. Required records
      such as the itemized bill or discharge summary are missing. Please
      resubmit with complete documents.
  - code: CODING_ERROR
    name: Billing or coding error
    profile: >
      The claim contains a billing or coding error. The procedure code,
      diagnosis code or modifier is invalid, mismatched or inconsistent with
      the services billed.
  - code: DUPLICATE_CLAIM
    name: Duplicate submission
    profile: >
      This claim is a duplicate of a previously submitted claim for the same
      member, provider, date of service and amount.
  - code: TIMELY_FILING
    name: Filed after the deadline
    profile: >
      The claim was not filed within the timely filing limit. It was received
      after the deadline for submission measured from the date of service.

