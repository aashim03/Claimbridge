# Clause lineages for LumenCare Silver (fictional).
#
# A lineage is the stable identity of a clause across policy versions.
# For each version the lineage is present in, the loader creates one Clause
# node: clause_id = C-<year>-<lineage suffix>, linked by SUPERSEDES to the
# previous version's clause of the same lineage.
#
#   versions.<V>: inherit      -> identical to the previous version (unchanged params)
#   versions.<V> missing       -> lineage absent in that version
#
# Flattened params that Cypher compares:
#   referral_exception, max_sessions, notify_hours, wait_months, limit_days,
#   req_emergency (clause only applies to emergencies), no_basis (exclusion, no appeal path)
#
# `routes` say which (denial reason, service) a denial under this lineage cites.
# service "*" is a wildcard; a specific service beats the wildcard; then higher `priority` wins.
# `requires` = evidence an appeal under this clause needs.

- lineage_id: L-MRI-PREAUTH
  section: "4.2"
  title: Prior authorization for outpatient MRI
  governs: [MRI]
  routes: [{reason: PREAUTH_MISSING, service: MRI}]
  versions:
    V2024:
      type: CONDITION
      text: >
        Outpatient magnetic resonance imaging requires prior authorization from the
        Plan. Prior authorization is not required where the MRI was ordered on the
        written referral of a board-certified specialist.
      requires: [SPECIALIST_REFERRAL]
      params: {referral_exception: true}
    V2025: inherit
    V2026:
      type: CONDITION
      text: >
        Outpatient magnetic resonance imaging requires prior authorization from the
        Plan before the date of service. No referral exception applies. Where
        authorization was not obtained, a retroactive authorization request supported
        by a letter of medical necessity may be submitted.
      requires: [RETRO_AUTH_REQUEST, PHYSICIAN_NECESSITY_LETTER]
      params: {referral_exception: false}

- lineage_id: L-PHYSIO-LIMIT
  section: "5.1"
  title: Physiotherapy session limit
  governs: [PHYSIO]
  routes: [{reason: NOT_MED_NECESSARY, service: PHYSIO}]
  versions:
    V2024:
      type: LIMIT
      text: >
        Physiotherapy is covered up to 20 sessions per plan year. Sessions are
        considered medically necessary when supported by clinical progress notes.
      requires: [PROGRESS_NOTES]
      params: {max_sessions: 20}
    V2025: inherit
    V2026:
      type: LIMIT
      text: >
        Physiotherapy is covered up to 12 sessions per plan year. Sessions beyond
        the twelfth require a physician letter of medical necessity and clinical
        progress notes demonstrating functional improvement.
      requires: [PHYSICIAN_NECESSITY_LETTER, PROGRESS_NOTES]
      params: {max_sessions: 12}

- lineage_id: L-OON-EMERGENCY
  section: "6.3"
  title: Out-of-network services
  governs: [ER_VISIT, AMBULANCE, MRI, INPATIENT_SURGERY]
  routes: [{reason: OUT_OF_NETWORK, service: "*"}]
  versions:
    V2024:
      type: CONDITION
      text: >
        Services from out-of-network providers are not covered, except emergency
        services, which are covered at the in-network rate when an emergency
        attestation is filed within 72 hours of admission.
      requires: [EMERGENCY_ATTESTATION, DISCHARGE_SUMMARY]
      params: {notify_hours: 72, req_emergency: true}
    V2025: inherit
    V2026:
      type: CONDITION
      text: >
        Services from out-of-network providers are not covered, except emergency
        services, which are covered at the in-network rate when an emergency
        attestation is filed within 48 hours of admission.
      requires: [EMERGENCY_ATTESTATION, DISCHARGE_SUMMARY]
      params: {notify_hours: 48, req_emergency: true}

- lineage_id: L-BARIATRIC
  section: "7.4"
  title: Bariatric surgery
  governs: [BARIATRIC]
  routes: [{reason: EXCLUDED_SERVICE, service: BARIATRIC}]
  versions:
    V2024:
      type: EXCLUSION
      text: >
        Bariatric surgery and other surgical treatment of obesity are excluded.
      requires: []
      params: {no_basis: true}
    V2025:
      type: COVERAGE
      text: >
        Bariatric surgery is covered for members with a documented BMI of 40 or
        more who completed a six-month supervised weight-loss program.
      requires: [BMI_RECORD, SUPERVISED_PROGRAM_RECORD]
      params: {no_basis: false}
    V2026: inherit

