# Seed semantic memory: Findings learned from verified historical cases.
#
# The case generator creates `support` OVERTURNED historical claims for each
# Finding (cycling through `learned_in` versions), each with the `needs`
# evidence, and `contradicted_by` later UPHELD claims under the same conditions.
# Seeding links each Finding to those resolutions with DERIVED_FROM /
# CONTRADICTED_BY.
#
# VALID_IN is NOT listed here. It is computed: every policy version whose clause
# for this lineage has the same params as the clause the Finding was learned on.
# That is the same rule the Curator applies when a new version is published.

