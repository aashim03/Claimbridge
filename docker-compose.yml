# ClaimBridge stack.
#   docker compose up -d falkordb                 database only (develop locally)
#   docker compose --profile app up -d --build    everything: database, seed, API, agent pool, web (.env is optional)
#   then open http://localhost:3100
#
# Every host port is bound to localhost and can be moved with a variable in .env (WEB_PORT, API_PORT, DB_PORT,
# DB_UI_PORT), e.g. to run a second copy side by side. To serve other machines, put a reverse proxy with HTTPS in
# front and use AUTH_MODE=protected: the default demo mode gives every visitor operator controls.
services:
  falkordb:
    # Pinned: FalkorDB 4.22.1 (module version 42201), the version every test and result here was produced on.
    image: falkordb/falkordb@sha256:b0bdcac2cbaff989e77cb0610439b7a9289e86de033ccbbd4368b66fb680ae7a
    ports:
      - "127.0.0.1:${DB_PORT:-6379}:6379"       # FalkorDB (Redis protocol), local access only
      - "127.0.0.1:${DB_UI_PORT:-3000}:3000"    # FalkorDB Browser
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  seed:
    profiles: ["app", "agents"]
    build: {context: ., dockerfile: backend/Dockerfile}
    command: ["reset"]
    env_file: [{path: .env, required: false}]   # optional: the stack runs without one
    environment: &env
      FALKORDB_HOST: falkordb
      GRAPH: claimbridge
    volumes:
      - embed_cache:/app/.fastembed_cache
    depends_on:
      falkordb: {condition: service_healthy}

  # The Supervisor runs every worker as its own process, executes KILL/START
  # commands written into the graph, and records expired leases.
  agents:
    profiles: ["app", "agents"]
    build: {context: ., dockerfile: backend/Dockerfile}
    command: ["up", "--pool", "intake=1,retrieval=1,verifier=2,planner=1,curator=1"]
    env_file: [{path: .env, required: false}]   # optional: the stack runs without one
    environment:
      <<: *env
      STEP_DELAY_S: "1.5"   # demo pacing: each step stays visible for a moment
    volumes:
      - ./data/llm_cache:/app/data/llm_cache   # recorded LLM responses survive restarts
    depends_on:
      seed: {condition: service_completed_successfully}

  api:
    profiles: ["app"]
    build: {context: ., dockerfile: backend/Dockerfile}
    entrypoint: ["uvicorn"]
    command: ["claimbridge.api:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: [{path: .env, required: false}]   # optional: the stack runs without one
    environment: *env
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - embed_cache:/app/.fastembed_cache
      - ./data/llm_cache:/app/data/llm_cache   # investigator recordings replay in the UI and survive restarts
    depends_on:
      seed: {condition: service_completed_successfully}

  web:
    profiles: ["app"]
    build:
      context: ./web
      args: {API_URL: "http://api:8000"}
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3000"
    depends_on: [api]

  # MCP server (read-only graph tools over stdio) for Claude Desktop, the MCP Inspector or any MCP client:
  #   docker compose run --rm -T --quiet-build mcp
  # It runs as ONE tenant (CLAIMBRIDGE_MCP_TENANT) against its own graph (CLAIMBRIDGE_MCP_GRAPH).
  mcp:
    profiles: ["mcp"]
    build: {context: ., dockerfile: backend/Dockerfile}
    command: ["mcp"]
    stdin_open: true
    env_file: [{path: .env, required: false}]
    environment:
      <<: *env
      CLAIMBRIDGE_MCP_TENANT: ${CLAIMBRIDGE_MCP_TENANT:-TEN-01}
      CLAIMBRIDGE_MCP_GRAPH: ${CLAIMBRIDGE_MCP_GRAPH:-claimbridge}
    depends_on:
      falkordb: {condition: service_healthy}

volumes:
  falkordb_data:
  embed_cache:
